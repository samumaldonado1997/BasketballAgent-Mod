name: Build Basketball Agent Cheat Menu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build CheatMenu.framework
        run: |
          mkdir -p build/CheatMenu.framework
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -dynamiclib \
            -fobjc-arc \
            -miphoneos-version-min=15.0 \
            CheatMenu/CheatMenu.m \
            -framework UIKit \
            -framework Foundation \
            -lsqlite3 \
            -install_name '@rpath/CheatMenu.framework/CheatMenu' \
            -o build/CheatMenu.framework/CheatMenu

          cat > build/CheatMenu.framework/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>CheatMenu</string>
          <key>CFBundleIdentifier</key><string>local.ba.cheatmenu</string>
          <key>CFBundleName</key><string>CheatMenu</string>
          <key>CFBundlePackageType</key><string>FMWK</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          <key>MinimumOSVersion</key><string>15.0</string>
          </dict></plist>
          EOF

          plutil -lint build/CheatMenu.framework/Info.plist
          file build/CheatMenu.framework/CheatMenu
          otool -L build/CheatMenu.framework/CheatMenu

      - name: Package framework
        run: |
          cd build
          zip -r BasketballAgent-CheatMenu-v1.zip CheatMenu.framework

      - name: Upload compiled framework
        uses: actions/upload-artifact@v4
        with:
          name: BasketballAgent-CheatMenu-v1
          path: build/BasketballAgent-CheatMenu-v1.zip
